name: Build VaultMount

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build static arm64 gocryptfs
        run: |
          git clone --depth 1 --branch v2.4.0 https://github.com/rfjakob/gocryptfs.git /tmp/gocryptfs
          cd /tmp/gocryptfs
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -tags without_openssl -ldflags "-s -w" -o "$GITHUB_WORKSPACE/bin/gocryptfs" .
          file "$GITHUB_WORKSPACE/bin/gocryptfs"

      - name: Build Zygisk libs and module zip
        run: |
          sudo apt-get install -y zip >/dev/null
          chmod +x build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VaultMount
          path: VaultMount.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VaultMount.zip
